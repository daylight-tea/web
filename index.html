<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人網頁 | 網頁建構中</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfbf7; /* 象牙白/紙張質感 */
            color: #2d3436;
        }
        .serif { font-family: 'Playfair Display', serif; }
        .academic-blue { color: #1a365d; }
        
        /* 細緻的背景紋理 */
        .hero-pattern {
            background-image: radial-gradient(#1a365d 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            opacity: 0.05;
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        /* 動態進度條動畫 */
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 10%; }
        }
        .animate-progress {
            animation: progress 2s ease-out forwards;
        }

        /* 呼吸燈效果 */
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="antialiased h-screen flex items-center justify-center overflow-hidden">

    <div class="hero-pattern"></div>

    <main class="relative z-10 max-w-2xl w-full px-6 text-center">
        <!-- 學術圖示裝飾 -->
        <div class="mb-8 inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow-lg border border-gray-100 animate-pulse-slow">
            <i data-lucide="book-open" class="w-10 h-10 academic-blue"></i>
        </div>

        <!-- 姓名與頭銜 (Updated to Teacher Daylight) -->
        <h1 class="text-4xl md:text-6xl font-bold serif academic-blue mb-4 tracking-tight">
            Teacher Daylight
        </h1>

        <!-- 建構中訊息 -->
        <div class="inline-block px-4 py-1.5 bg-blue-50 text-blue-900 rounded-full text-sm font-semibold tracking-widest uppercase mb-8 border border-blue-100">
            Site Under Construction
        </div>

        <div class="bg-white/50 backdrop-blur-sm p-8 rounded-3xl border border-white shadow-xl mb-12">
            <p class="text-lg text-gray-600 mb-8 leading-relaxed italic serif">
                「教育不是灌輸，而是點燃火焰。」<br>
                學術資源與個人見解整備中，敬請期待。
            </p>

            <!-- 進度條 -->
            <div class="space-y-2">
                <div class="flex justify-between text-xs font-bold text-gray-400 uppercase tracking-widest">
                    <span>Development Progress</span>
                    <span>10%</span>
                </div>
                <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full bg-academic-blue rounded-full animate-progress"></div>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4 text-gray-400">
            <div class="flex items-center gap-2">
                <i data-lucide="mail" class="w-4 h-4"></i>
                <span class="text-sm font-medium">尚在建置中</span>
            </div>
            <div class="h-8 w-px bg-gray-200"></div>
            <p class="text-xs tracking-widest text-gray-400 uppercase">
                &copy; 2024 Teacher Daylight. All Rights Reserved.
            </p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化 Lucide 圖示
            lucide.createIcons();
        });
    </script>
</body>
</html>
